<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc carte</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #060606; color: #aaa; font: 12px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; height: 100%; }
  .pane { flex: 1; position: relative; min-width: 0; }
  #ref { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #c { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; right: 8px; top: 8px; background: rgba(0,0,0,.75); padding: 8px 10px; border-radius: 6px; width: 250px; }
  #ui label { display: grid; grid-template-columns: 82px 1fr 44px; gap: 6px; align-items: center; }
  #ui input { width: 100%; }
  #ui .row { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  body.noref #refpane { display: none; }
  body.noui #ui { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="pane" id="refpane"><img id="ref" alt=""></div>
  <div class="pane"><canvas id="c"></canvas></div>
</div>
<div id="ui"></div>
<script type="module" src="./src/cards/bench.js"></script>
</body>
</html>
