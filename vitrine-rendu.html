<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rendu de la vitrine</title>
<style>
  @font-face { font-family: 'SG Garamond'; src: url(./fonts/EBGaramond-500.woff2) format('woff2'); font-weight: 500; }
  html, body { margin: 0; background: #060606; }
  #c { display: block; width: 414px; height: 690px; }
</style>
</head>
<body>
<canvas id="c" width="828" height="1380"></canvas>
<script type="module">
  // La vitrine de alt.html (10/10) : les objets de l'envoi, joués par le vrai moteur des cartes (même papier, même
  // lumière, même gaufrage), image par image : tools/vitrine-shot.mjs les enregistre en boucles vidéo dans
  // public/vitrine/<id>.mp4. ?id=carte|carbone|fil&t=… : une image, pour regarder (sans l'outil).
  //   carte   : le paquet se mélange (deux fois), une carte sort du milieu, face cachée, et vient vers nous
  //   carbone : une carte noire vierge, le papier carbone posé dessus, un prénom écrit à la main au travers, le
  //             carbone s'en va (le prénom en blanc), un timbre se pose dans le coin
  //   fil     : des cartes à prénoms, un fil noir passe par les trous de chacune, la guirlande se tend et balance
  import { createCardRenderer, M4, CARD } from './src/cards/cardRenderer.js';
  import { loadTypeFont } from './src/cards/ink.js';
  import { LOOK } from './src/cards/scene.js';
  import { createRng } from './src/field/rng.js';

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true, preserveDrawingBuffer: true });
  const card = await createCardRenderer(gl, './');
  await loadTypeFont('./');
  await document.fonts.load('400 80px "Segoe Script"').catch(() => {});
  const L = { ...LOOK };
  const FOV = 26 * Math.PI / 180, TF = Math.tan(FOV / 2), PITCH = 0.15;
  const W = canvas.width, H = canvas.height;
  const clamp01 = u => Math.min(1, Math.max(0, u));
  const ss = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const easeOut = u => 1 - Math.pow(1 - u, 3);
  const lerp = (a, b, u) => a + (b - a) * u;
  const mix3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
  const pose = (p, x = p.x, y = p.y, z = p.z) => M4.model(p.rx || 0, p.ry || 0, p.rz || 0, x, y, z);

  card.addShape('carbon', { w: 102, h: 66, r: 0.5, t: 0.05 });
  card.addShape('stamp', { w: 20, h: 24, r: 0.25, t: 0.06 });
  card.addShape('thread', { w: 1, h: 1, r: 0.45, t: 0.9 });
  card.addShape('hole', { w: 3.4, h: 3.4, r: 1.7, t: 0.02 });

  // une caméra de face, un peu basse (comme la scène des cartes) ; Hw : hauteur vue au plan z = 0
  function camera(cx, cy, Hw, tilt = 0.2, yaw = 0, tz = 0) {
    const D = Hw / (2 * TF);
    const eye = [cx + D * Math.sin(yaw) * Math.cos(tilt), cy - D * Math.sin(tilt), tz + D * Math.cos(tilt) * Math.cos(yaw)];
    const vp = M4.mul(M4.perspective(FOV, W / H, D * 0.2, D * 4), M4.lookAt(eye, [cx, cy, tz], [0, 1, 0]));
    return { vp, eye, D, Hw, cy, cx, tz };
  }
  // la lampe des exemples : rasante, de côté, elle respire lentement (le gaufrage vit)
  function lamp(cam, t, az0 = L.lightAz + 0.3) {
    const Hw = cam.Hw, kf = 2.2, kk = Hw / 235 * kf, R = L.lightR0 * Hw * kf, Z = L.lightZ * kk, D0 = Math.hypot(R, Z), el0 = Math.atan2(Z, R);
    const az = az0 + 0.32 * Math.sin(t * 0.55) + 0.12 * Math.sin(t * 1.3 + 1), el = L.elBase + 0.06 * Math.sin(t * 0.4 + 2);
    return { ...L, lightPos: [cam.cx + Math.cos(az) * D0 * Math.cos(el), cam.cy + Math.sin(az) * D0 * Math.cos(el), cam.tz + D0 * Math.sin(el)],
      light: L.light * kk * kk * Math.sin(el0) / Math.sin(el), spotI: 0 };
  }
  function begin() {
    gl.viewport(0, 0, W, H);
    gl.clearColor(6 / 255, 6 / 255, 6 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
  }
  const rnd = createRng(20261010);
  const variant = () => ({
    seed: rnd() * 100,
    paperXf: [rnd.range(-2.5, 2.5), rnd.range(-1.5, 1.5), rnd() < 0.5 ? 0 : Math.PI, 0],
    logoOff: [rnd.range(-0.15, 0.15), rnd.range(-0.15, 0.15)],
    warp: [rnd.range(0.05, 0.35), rnd.range(-0.2, 0.05), rnd.range(-0.12, 0.12)],
    jx: rnd.range(-0.5, 0.5), jy: rnd.range(-0.4, 0.4), jr: rnd.range(-0.012, 0.012),
  });

  // ---- une écriture à la main (prénom) : carte d'encre ; reveal = part écrite (0–1, de gauche à droite) ----
  function handInk(text, wmm, hmm, pxmm, o = {}) {
    const c = new OffscreenCanvas(Math.round(wmm * pxmm), Math.round(hmm * pxmm)), x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height);
    const fs = (o.size || 11) * pxmm;
    x.save(); x.translate(c.width / 2 + (o.dx || 0) * pxmm, c.height / 2 + (o.dy || 0) * pxmm); x.rotate(o.rot ?? -0.06);
    x.font = `400 ${fs}px "Segoe Script", "Ink Free", cursive`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const tw = x.measureText(text).width;
    if (o.reveal != null) { const r = clamp01(o.reveal); x.beginPath(); x.rect(-tw / 2 - fs, -fs * 2, (tw + fs * 0.6) * r + fs * 0.4, fs * 4); x.clip(); }
    x.fillStyle = '#fff'; x.fillText(text, 0, 0);
    x.restore();
    // le grain du carbone : la trace n'est jamais pleine
    const g = new OffscreenCanvas(c.width, c.height), gx = g.getContext('2d'), im = gx.createImageData(c.width, c.height), r2 = createRng(o.seed || 7);
    for (let i = 0; i < im.data.length; i += 4) { const v = 150 + 105 * r2(); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    gx.putImageData(im, 0, 0);
    x.globalCompositeOperation = 'multiply'; x.drawImage(g, 0, 0);
    return { canvas: c, width: tw / pxmm };
  }
  // ---- le timbre : dentelé (les dents = le papier noir, comme des trous sur le noir), le logo gaufré au milieu ----
  function stampInk() {
    const k = 30, w = 20, h = 24, c = new OffscreenCanvas(w * k, h * k), x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#000'; x.fillRect(2.3 * k, 2.3 * k, (w - 4.6) * k, (h - 4.6) * k);
    x.strokeStyle = '#fff'; x.lineWidth = 0.22 * k; x.strokeRect(3.1 * k, 3.1 * k, (w - 6.2) * k, (h - 6.2) * k);
    const dent = (x0, y0, x1, y1, n) => { for (let i = 0; i <= n; i++) { x.beginPath(); x.arc(lerp(x0, x1, i / n) * k, lerp(y0, y1, i / n) * k, 0.72 * k, 0, Math.PI * 2); x.fillStyle = '#000'; x.fill(); } };
    dent(0, 0, w, 0, 10); dent(0, h, w, h, 10); dent(0, 0, 0, h, 12); dent(w, 0, w, h, 12);
    x.fillStyle = '#fff'; x.font = `${1.7 * k}px "SG Machine"`; x.textAlign = 'center'; x.fillText('SINGULIES', w / 2 * k, (h - 4.3) * k);
    return c;
  }

  // =================================== carte : le mélange, puis la carte tirée ===================================
  const DECK = (() => {
    const N = 14, vs = Array.from({ length: N }, variant), Y0 = -24, SEP = 31;
    // deux mélanges (le second plus vif) : chacun coupe le paquet en deux paquets levés, qui lâchent leurs cartes
    // l'une après l'autre, alternées, au milieu ; puis on égalise
    const rr = createRng(41);
    const riffle = (order, t0, k) => {
      const A = order.slice(N / 2), B = order.slice(0, N / 2), out = [];
      let a = 0, b = 0, turn = 1;
      while (a < A.length || b < B.length) {
        const from = (b >= B.length) ? 0 : (a >= A.length) ? 1 : turn;
        out.push(from ? B[b++] : A[a++]);
        if (rr() < 0.75) turn = 1 - turn;
      }
      return { t0, k, before: order, after: out, A, B };
    };
    const order0 = [...Array(N).keys()];
    const R1 = riffle(order0, 0.5, 1), R2 = riffle(R1.after, 3.0, 0.78);
    const DRAW = 5.0, PICK = 7;            // la carte tirée : la 8e en partant du bas
    const picked = R2.after[PICK];
    const restPose = (id, p) => ({ x: vs[id].jx, y: Y0 + vs[id].jy, z: p * PITCH, rz: vs[id].jr });
    function inRiffle(R, id, t) {
      const { t0, k } = R, tSplit = t0 + 0.6 * k, tRif = t0 + 1.75 * k, tSq = t0 + 2.25 * k;
      const p0 = R.before.indexOf(id), j = R.after.indexOf(id);
      const inA = R.A.includes(id), q = inA ? R.A.indexOf(id) : R.B.indexOf(id);
      const held = { x: vs[id].jx * 2, y: Y0 + (inA ? SEP : -SEP), z: 5 + q * PITCH, rx: inA ? -0.1 : 0.1, rz: (inA ? -0.03 : 0.03) + vs[id].jr };
      const rest0 = restPose(id, p0);
      if (t < t0) return rest0;
      if (t < tSplit) { const u = ease((t - t0) / (tSplit - t0)); const p = { x: lerp(rest0.x, held.x, u), y: lerp(rest0.y, held.y, u), z: lerp(rest0.z, held.z, u) + 6 * Math.sin(Math.PI * u) * (inA ? 1 : 0.4), rx: held.rx * u, rz: lerp(rest0.rz, held.rz, u) }; return p; }
      const rel = tSplit + 0.08 * k + (tRif - tSplit - 0.3 * k) * j / N, dur = 0.26 * k;
      const pile = { x: vs[id].jx * 5 + (rr.range ? 0 : 0), y: Y0 + vs[id].jy * 4 + (inA ? 1.2 : -1.2), z: j * PITCH, rx: 0, rz: vs[id].jr * 4 };
      if (t < rel) return held;
      if (t < rel + dur) { const u = (t - rel) / dur, e = u * u; return { x: lerp(held.x, pile.x, e), y: lerp(held.y, pile.y, easeOut(u)), z: lerp(held.z, pile.z, e) + 1.5 * Math.sin(Math.PI * u), rx: lerp(held.rx, 0, u), rz: lerp(held.rz, pile.rz, u) }; }
      const rest1 = restPose(id, j);
      const u = ss(tRif, tSq, t);
      return { x: lerp(pile.x, rest1.x, u), y: lerp(pile.y, rest1.y, u), z: rest1.z, rx: 0, rz: lerp(pile.rz, rest1.rz, u) };
    }
    function cardPose(id, t) {
      if (t < R2.t0) return inRiffle(R1, id, t);
      if (t < DRAW || id !== picked) {
        const p = inRiffle(R2, id, t);
        if (t > DRAW && R2.after.indexOf(id) > PICK) p.z -= PITCH * ss(DRAW + 0.2, DRAW + 1.0, t);   // les cartes du dessus descendent d'un cran
        return p;
      }
      // la carte tirée : elle glisse hors du paquet (vers nous, en bas), puis se soulève et vient se présenter, face cachée
      const r = restPose(id, PICK), u1 = ease(clamp01((t - DRAW) / 0.95)), u2 = ease(clamp01((t - DRAW - 0.85) / 1.35));
      const out = { x: r.x + 4, y: Y0 - 58, z: r.z };
      const end = { x: 0, y: 14, z: 50 };
      const p1 = { x: lerp(r.x, out.x, u1), y: lerp(r.y, out.y, u1), z: r.z };
      const c1 = { x: out.x + 2, y: out.y - 6, z: 26 };     // l'arc : elle passe devant le paquet
      const bz = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
      const tt = t - DRAW - 2.2, br = t > DRAW + 2.2 ? 1 : 0;
      return { x: u2 > 0 ? bz(p1.x, c1.x, end.x, u2) : p1.x, y: u2 > 0 ? bz(p1.y, c1.y, end.y, u2) : p1.y, z: u2 > 0 ? bz(p1.z, c1.z, end.z, u2) : p1.z,
        rx: -0.32 * u2 + br * 0.05 * Math.sin(tt * 1.1), ry: br * 0.09 * Math.sin(tt * 0.8 + 0.5), rz: lerp(r.rz, -0.035, u2) };
    }
    return {
      dur: 8.6,
      frame(t) {
        const cam = camera(0, 4, 182, 0.2);
        const P = lamp(cam, t);
        begin();
        const intro = ss(0, 0.6, t), dim = 1 - 0.42 * ss(DRAW + 1.2, DRAW + 2.4, t);
        // de loin à près (la carte tirée en dernier : elle passe devant)
        const ids = [...Array(N).keys()].map(id => ({ id, p: cardPose(id, t) })).sort((a, b) => (a.id === picked && t > DRAW + 0.9) - (b.id === picked && t > DRAW + 0.9) || a.p.z - b.p.z);
        for (const { id, p } of ids) {
          const top = id === picked && t > DRAW;
          card.draw(cam.vp, cam.eye, P, { model: pose(p), lod: top || p.rx ? 'fine' : 'coarse', ...vs[id], shade: top ? 1 : dim * (0.7 + 0.3 * clamp01(p.z / (N * PITCH))), fade: intro });
        }
      },
    };
  })();

  // ====================== carbone : la carte vierge, le carbone, le prénom à la main, le timbre ======================
  const CARBON = (() => {
    const v = variant(), vc = variant(), vs = variant();
    const NAME = 'Julie';
    const full = handInk(NAME, CARD.w, CARD.h, 20, { size: 12, dy: 1.5, seed: 3 });
    const cardInk = card.makeInk(full.canvas);
    const stamp = card.makeInk(stampInk());
    // la trace sur le carbone : la même écriture (le carbone est plus grand que la carte : décalée d'autant)
    const traces = [];
    for (let i = 0; i <= 24; i++) traces.push(card.makeInk(handInk(NAME, 102, 66, 12, { size: 12, dy: 1.5 + 1.3, dx: -4, seed: 5, reveal: i / 24 }).canvas));
    const T_FLIP = [1.1, 2.2], T_IN = [2.4, 3.2], T_W = [3.35, 5.25], T_OUT = [5.5, 6.4], T_ST = [6.7, 7.35];
    const carbonP = { albedo: 0.016, rough: 0.28, spec: 4.5, sheen: 0.4, grain: 0.35, fiber: 0.012, glint: 0.12, edge: 0.6, inkAlb: 0.22 };
    return {
      dur: 9.0,
      frame(t) {
        const cam = camera(0, 4, 190, 0.22);
        const P = lamp(cam, t, L.lightAz + 0.15);
        begin();
        const uf = ease(clamp01((t - T_FLIP[0]) / (T_FLIP[1] - T_FLIP[0])));
        const arrive = easeOut(clamp01(t / 1.0));
        const cp = { x: 0, y: -8 - 10 * (1 - arrive), z: -20 * (1 - arrive) + 18 * Math.sin(Math.PI * uf), ry: Math.PI + Math.PI * uf, rx: -0.12 * Math.sin(Math.PI * uf), rz: v.jr * 3 };
        // la face lisse (face 0) porte le prénom une fois le carbone posé ; l'autre, le logo en relief (logoK 1)
        card.draw(cam.vp, cam.eye, P, { model: pose(cp), lod: 'fine', ...v, logoK: 1, inkBack: t > T_IN[1] ? cardInk : null, fade: ss(0, 0.7, t) });
        // le carbone : il arrive de la droite, on écrit au travers, il repart
        if (t > T_IN[0] && t < T_OUT[1] + 0.1) {
          const ui = ease(clamp01((t - T_IN[0]) / (T_IN[1] - T_IN[0]))), uo = ease(clamp01((t - T_OUT[0]) / (T_OUT[1] - T_OUT[0])));
          const p = { x: lerp(140, 3, ui) + 150 * uo, y: -8 - 1.3 + 4 * uo, z: 0.6 + 7 * Math.sin(Math.PI * ui) * (1 - ui * 0.5) + 16 * Math.sin(Math.PI * Math.min(1, uo * 1.4)), rz: lerp(-0.12, -0.02, ui) - 0.08 * uo, ry: -0.18 * uo };
          const wr = clamp01((t - T_W[0]) / (T_W[1] - T_W[0])), tr = traces[Math.round(wr * 24)];
          card.draw(cam.vp, cam.eye, { ...P, ...carbonP }, { model: pose(p), lod: 'carbon', ...vc, noLogo: true, inkBack: t > T_W[0] ? tr : null, paperTile: 30, paperLo: 0.4 });
        }
        // le timbre : il tombe dans le coin haut-droit
        if (t > T_ST[0]) {
          const u = clamp01((t - T_ST[0]) / (T_ST[1] - T_ST[0])), d = easeOut(u), bounce = u >= 1 ? 0 : 0;
          const sx = 29.5, sy = -8 + 12;
          const p = { x: sx + 18 * (1 - d), y: sy + 22 * (1 - d), z: 0.5 + 40 * (1 - d) * (1 - d) + bounce, rz: lerp(0.5, 0.06, d), rx: 0.25 * (1 - d) };
          card.draw(cam.vp, cam.eye, P, { model: pose(p), lod: 'stamp', ...vs, inkBack: stamp, logoScale: [0.3, 0.3], logoOff: [0, 1.2], fade: ss(T_ST[0], T_ST[0] + 0.25, t) });
        }
      },
    };
  })();

  // =========================== fil : les cartes à prénoms, le fil qui les relie, la guirlande ===========================
  const FIL = (() => {
    const NAMES = ['Julie', 'Anaïs', 'Marysol', 'Isabelle', 'Lou'];
    const n = NAMES.length, vs = NAMES.map(() => variant());
    const inks = NAMES.map((s, i) => card.makeInk(handInk(s, CARD.w, CARD.h, 20, { size: s.length > 6 ? 10.5 : 12, dy: 4, rot: -0.05 + 0.04 * i % 0.09, seed: 11 + i }).canvas));
    const D = [122, -3, -22], O = [0, 0, 0];                   // pas d'une carte à la suivante ; la première
    const RY = Math.atan2(-D[2], D[0]);
    const HX = CARD.w / 2 - 6.5, HY = CARD.h / 2 - 6;
    const threadP = { albedo: 0.05, rough: 0.42, spec: 2.4, sheen: 0.3, grain: 0.2, fiber: 0, glint: 0.2, edge: 0 };
    const holeP = { albedo: 0.0, spec: 0, env: 0, sheen: 0, glint: 0 };
    const T_THREAD = [1.0, 5.6], T_TIGHT = [5.6, 6.6];
    const jolt = new Array(n).fill(-9), camS = { t: 0, x: 0, v: 0 };
    function cardM(i, t) {
      const sw = Math.sin(t * 0.9 + i * 0.7) * 0.025 + Math.sin(t * 0.37 + i * 1.9) * 0.015;
      const ja = t - jolt[i] > 0 && t - jolt[i] < 2 ? Math.exp(-(t - jolt[i]) * 3) * Math.sin((t - jolt[i]) * 11) * 0.05 : 0;
      const lift = 3 * ss(T_TIGHT[0], T_TIGHT[1], t);
      const c = [O[0] + D[0] * i, O[1] + D[1] * i + lift + 1.2 * Math.sin(t * 0.8 + i), O[2] + D[2] * i];
      return M4.model(0.05 * Math.sin(t * 0.6 + i), RY + 0.06 * Math.sin(t * 0.5 + i * 1.3), sw + ja, c[0], c[1], c[2]);
    }
    const ap = (M, x, y, z) => [M[0] * x + M[4] * y + M[8] * z + M[12], M[1] * x + M[5] * y + M[9] * z + M[13], M[2] * x + M[6] * y + M[10] * z + M[14]];
    function path(t) {
      const Ms = NAMES.map((_, i) => cardM(i, t)), pts = [], sag = lerp(16, 9, ss(T_TIGHT[0], T_TIGHT[1], t));
      const sagTo = (a, b, s, k = 22) => { for (let j = 1; j <= k; j++) { const u = j / k, p = mix3(a, b, u); p[1] -= s * 4 * u * (1 - u); pts.push({ p, f: true }); } };
      const first = ap(Ms[0], -HX, HY, 0.8);
      const start = [first[0] - 70, first[1] + 20, first[2] + 30];
      pts.push({ p: start, f: true });
      sagTo(start, first, sag * 0.7);
      Ms.forEach((M, i) => {
        const lf = ap(M, -HX, HY, 0.8), lb = ap(M, -HX, HY, -0.8), rb = ap(M, HX, HY, -0.8), rf = ap(M, HX, HY, 0.8);
        pts.push({ p: lb, f: false, card: i }); pts.push({ p: rb, f: false }); pts.push({ p: rf, f: true, card: i, out: true });
        if (i < n - 1) sagTo(rf, ap(Ms[i + 1], -HX, HY, 0.8), sag);
        else { const end = [rf[0] + 28, rf[1] - 34, rf[2] - 14]; sagTo(rf, end, 6, 10); }   // le bout qui pend (celui du poignet)
      });
      return { pts, Ms };
    }
    return {
      dur: 9.5,
      frame(t) {
        const { pts, Ms } = path(t);
        // longueur parcourue par la pointe du fil
        const len = [0]; for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i].p[0] - pts[i - 1].p[0], pts[i].p[1] - pts[i - 1].p[1], pts[i].p[2] - pts[i - 1].p[2]));
        const head = len[len.length - 1] * ease(clamp01((t - T_THREAD[0]) / (T_THREAD[1] - T_THREAD[0])));
        // la vue : de près sur la première carte, elle suit la pointe du fil d'une carte à l'autre, puis recule sur la guirlande
        let hi = len.findIndex(l => l >= head); if (hi < 0) hi = pts.length - 1;
        const hx = Math.min(O[0] + D[0] * (n - 1), Math.max(O[0], pts[hi].p[0]));
        if (t === 0 || camS.t > t) { Object.assign(camS, { x: O[0], v: 0 }); jolt.fill(-9); }
        const dt = t - camS.t; camS.t = t;
        if (dt > 0) { const w = 3.2; camS.v += (w * w * (hx - camS.x) - 2 * w * camS.v) * dt; camS.x += camS.v * dt; }
        const back = ease(clamp01((t - 5.9) / 1.9)), mid = O[0] + D[0] * (n - 1) / 2;
        const cx = lerp(camS.x, mid, back), Hw = lerp(200, 340, back), tz = O[2] + D[2] * (cx - O[0]) / D[0];
        const cam = camera(cx, O[1] + 2 + 8 * back, Hw, 0.12, -0.12 * back, tz);
        const P = lamp(cam, t, L.lightAz + 0.2);
        begin();
        // le fil traverse une carte : elle sursaute un peu
        pts.forEach((q, i) => { if (q.card != null && q.out && len[i] <= head && jolt[q.card] < 0) jolt[q.card] = t; });
        const fade = ss(0, 0.9, t);
        Ms.forEach((M, i) => {
          card.draw(cam.vp, cam.eye, P, { model: M, lod: 'fine', ...vs[i], logoK: 1, inkBack: inks[i], fade });
          for (const sx of [-HX, HX]) card.draw(cam.vp, cam.eye, { ...P, ...holeP }, { model: M4.mul(M, M4.model(0, 0, 0, sx, HY, 0.09)), lod: 'hole', noLogo: true, fade });
        });
        // le fil : des petits segments le long du chemin, jusqu'à la pointe
        for (let i = 1; i < pts.length; i++) {
          if (len[i - 1] >= head) break;
          const a = pts[i - 1].p, b0 = pts[i].p, u = len[i] > head ? (head - len[i - 1]) / (len[i] - len[i - 1]) : 1, b = mix3(a, b0, u);
          const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], l = Math.hypot(dx, dy, dz); if (l < 1e-3) continue;
          const X = [dx / l, dy / l, dz / l];
          let Y = Math.abs(X[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
          const Z = [X[1] * Y[2] - X[2] * Y[1], X[2] * Y[0] - X[0] * Y[2], X[0] * Y[1] - X[1] * Y[0]], zl = Math.hypot(...Z);
          Z[0] /= zl; Z[1] /= zl; Z[2] /= zl;
          Y = [Z[1] * X[2] - Z[2] * X[1], Z[2] * X[0] - Z[0] * X[2], Z[0] * X[1] - Z[1] * X[0]];
          const th = 1.0, m = new Float32Array([X[0] * (l + 0.6), X[1] * (l + 0.6), X[2] * (l + 0.6), 0, Y[0] * th, Y[1] * th, Y[2] * th, 0, Z[0] * th, Z[1] * th, Z[2] * th, 0, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, 1]);
          card.draw(cam.vp, cam.eye, { ...P, ...threadP }, { model: m, lod: 'thread', noLogo: true, seed: i * 0.37 });
        }
      },
    };
  })();

  const SLIDES = { carte: DECK, carbone: CARBON, fil: FIL };
  window.__vit = {
    ready: true,
    dur: id => SLIDES[id].dur,
    frame: (id, t, q = 0.92) => { SLIDES[id].frame(t); gl.finish(); return canvas.toDataURL('image/jpeg', q); },
  };
  const Q = new URLSearchParams(location.search);
  if (Q.has('id')) SLIDES[Q.get('id')].frame(+(Q.get('t') || 0));
</script>
