<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cachet</title>
<style>
  html, body { margin: 0; height: 100%; background: #060606; overflow: hidden; color: #999; font: 12px system-ui; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 52vh; display: block; touch-action: none; }
  #ui { position: fixed; left: 0; right: 0; top: 52vh; bottom: 0; display: flex; flex-direction: column; background: #0b0b0b; border-top: 1px solid #1a1a1a; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px 4px; }
  #bar button { background: #222; color: #bbb; border: 0; border-radius: 6px; padding: 7px 11px; font: 12px system-ui; }
  #out { padding: 2px 10px 6px; color: #ddd; user-select: all; -webkit-user-select: all; word-break: break-all; min-height: 16px; }
  #panel { flex: 1; overflow: auto; padding: 0 10px 20px; -webkit-overflow-scrolling: touch; }
  #panel label { display: grid; grid-template-columns: 46% 1fr 44px; gap: 6px; align-items: center; margin: 5px 0; }
  #panel input { width: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="bar"><button id="copy">copier</button><button id="reset">remettre droite</button></div>
  <div id="out"></div>
  <div id="panel"></div>
</div>
<script type="module" src="./src/sheet/sealStage.js"></script>
</body>
</html>
