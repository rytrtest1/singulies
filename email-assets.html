<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Images de l'email (outil, non publié)</title>
<style>
  @font-face { font-family: 'SG Garamond'; src: url(./fonts/EBGaramond-500.woff2) format('woff2'); font-weight: 500; }
  html, body { margin: 0; background: #060606; }
</style>
</head>
<body>
<canvas id="c" width="720" height="440"></canvas>
<script type="module">
  // Rend, avec le vrai moteur, les images fixes de l'email (tools/email-assets.mjs les enregistre) :
  // une image par carte question (les 73), la carte blanche, et une image par lettre du prénom (A–Z).
  import { createCardRenderer, M4, CARD } from './src/cards/cardRenderer.js';
  import { loadTypeFont, makeInkMap } from './src/cards/ink.js';
  import { LOOK } from './src/cards/scene.js';
  import QUESTIONS from './src/cards/questions.json';

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true, preserveDrawingBuffer: true });
  const card = await createCardRenderer(gl, './');
  await loadTypeFont('./');
  await document.fonts.load('500 64px "SG Garamond"');
  const L = { ...LOOK };
  const FOV = 26 * Math.PI / 180, TILT = 0.22;

  // une carte, face lue, dans la caméra et la lumière des cartes (lampe rasante, de côté : jamais du côté du regard)
  function cardShot(text, { noLogo = false, seed = 1, frac = 0.86, dy = 0 } = {}) {
    const W = canvas.width, H = canvas.height;
    const pxmm = W * frac / CARD.w, Hw = H / pxmm, D = Hw / (2 * Math.tan(FOV / 2));
    const eye = [0, -D * Math.sin(TILT), D * Math.cos(TILT)];
    const vp = M4.mul(M4.perspective(FOV, W / H, D * 0.3, D * 3), M4.lookAt(eye, [0, 0, 0], [0, 1, 0]));
    const k = Hw / 235, R = L.lightR0 * Hw, Z = L.lightZ * k, D0 = Math.hypot(R, Z), el0 = Math.atan2(Z, R);
    const az = L.lightAz + 0.35, el = L.elBase;
    const P = { ...L, lightPos: [Math.cos(az) * D0 * Math.cos(el), Math.sin(az) * D0 * Math.cos(el), D0 * Math.sin(el)],
      light: L.light * k * k * Math.sin(el0) / Math.sin(el), spotI: 0 };
    gl.viewport(0, 0, W, H);
    gl.clearColor(6 / 255, 6 / 255, 6 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    const ink = card.makeInk(makeInkMap(text, seed).canvas);
    card.draw(vp, eye, P, { model: M4.model(0, Math.PI, 0.004, 0, dy), lod: 'fine', ink, noLogo, seed: seed % 97,
      paperXf: [0.6, -0.4, 0, 0], warp: [0.18, -0.08, 0.04], logoOff: [0, 0] });
    gl.finish();
    const url = canvas.toDataURL('image/jpeg', 0.86);
    card.freeInk(ink);
    return url;
  }

  // une lettre du prénom : EB Garamond 500, le gris du prénom sur le site (0,62 → 158), interlettrage 0,45 em
  // compris dans l'image (à droite), sur le fond du site (6) ; 2× pour les écrans fins
  const CAP_PX = 2 * 26, EM = CAP_PX / 0.65;
  function letterShot(ch) {
    const c = document.createElement('canvas'), x = c.getContext('2d');
    x.font = `500 ${EM}px "SG Garamond"`;
    const adv = x.measureText(ch).width, w = Math.ceil(adv + 0.45 * EM), h = Math.ceil(EM * 1.0);
    c.width = w; c.height = h;
    x.fillStyle = '#060606'; x.fillRect(0, 0, w, h);
    x.font = `500 ${EM}px "SG Garamond"`; x.fillStyle = 'rgb(158,158,158)'; x.textBaseline = 'alphabetic';
    x.fillText(ch, 0, Math.round(h * 0.5 + CAP_PX / 2));
    return { url: c.toDataURL('image/png'), w: w / 2, h: h / 2 };
  }

  // aperçu du lien (Open Graph, 1200 × 630) : ETERNEL comme sur le portail, et la première carte, « ton prénom ton poème, par la poste »
  async function ogShot() {
    canvas.width = 1200; canvas.height = 630;
    const url = cardShot('ton prénom ton poème, par la poste', { seed: 5, frac: 0.5, dy: -8 });
    const img = new Image(); img.src = url; await img.decode();
    const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    x.font = '500 40px "SG Garamond"'; x.letterSpacing = '18px'; x.fillStyle = 'rgb(174,174,174)'; x.textAlign = 'center';
    x.fillText('ETERNEL', 600 + 9, 96);
    canvas.width = 720; canvas.height = 440;
    return c.toDataURL('image/jpeg', 0.9);
  }

  // ---- la version simple (09/10, sans WebGL chez le visiteur) : les objets du site rendus une fois, en images ----
  // vue de face (sans inclinaison : les champs et les lettres posés par-dessus tombent juste), même lampe rasante.
  // Chaque image : l'objet occupe `frac` de la largeur, centré ; le reste est le fond du site (6).
  const { SHEET, LOGO_Y, LOGO_K } = await import('./src/sheet/sheet.js');
  const EV = await import('./src/sheet/envelope.js');
  function view(W, H, objW, frac) {
    canvas.width = W; canvas.height = H;
    const pxmm = W * frac / objW, Hw = H / pxmm, D = Hw / (2 * Math.tan(FOV / 2));
    const eye = [0, -D * Math.sin(0.04), D * Math.cos(0.04)];
    const vp = M4.mul(M4.perspective(FOV, W / H, D * 0.3, D * 3), M4.lookAt(eye, [0, 0, 0], [0, 1, 0]));
    const k = Hw / 235, kf = objW > 120 ? 2.2 : 1, R = L.lightR0 * Hw * kf, Z = L.lightZ * k * kf, D0 = Math.hypot(R, Z), el0 = Math.atan2(Z, R);
    const az = L.lightAz + 0.35, el = L.elBase;
    const P = { ...L, lightPos: [Math.cos(az) * D0 * Math.cos(el), Math.sin(az) * D0 * Math.cos(el), D0 * Math.sin(el)],
      light: L.light * k * k * kf * kf * Math.sin(el0) / Math.sin(el), spotI: 0 };
    gl.viewport(0, 0, W, H);
    gl.clearColor(6 / 255, 6 / 255, 6 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    return { vp, eye, P, pxmm };
  }
  const grab = (type = 'image/jpeg') => { gl.finish(); return canvas.toDataURL(type, 0.88); };
  const CW = 900, CH = 550, CF = 0.86;                       // cartes : même cadrage que les images de l'email (720 × 440)
  // une carte : face 'recto' (logo en creux, encre) ou 'dos' (logo gaufré) ; text : tapé dessus ; noLogo
  function cardImg({ face = 'recto', text = '', noLogo = false, seed = 1 } = {}) {
    const { vp, eye, P } = view(CW, CH, CARD.w, CF);
    const ink = text ? card.makeInk(makeInkMap(text, seed).canvas) : null;
    const v = { seed: seed % 97, paperXf: [0.6, -0.4, 0, 0], warp: [0.18, -0.08, 0.04], logoOff: [0, 0], noLogo };
    if (face === 'recto') card.draw(vp, eye, P, { model: M4.model(0, Math.PI, 0.004), lod: 'fine', ink, ...v });
    else card.draw(vp, eye, P, { model: M4.model(0, 0, -0.004), lod: 'fine', inkBack: ink, ...v });
    const url = grab(); if (ink) card.freeInk(ink); return url;
  }
  function sheetImg() {
    card.addShape('sheet', { ...SHEET, fine: [10, 10, 0.25, 0, LOGO_Y] });
    const { vp, eye, P } = view(800, 1100, SHEET.w, 0.92);
    card.draw(vp, eye, P, { model: M4.model(0, 0, 0), lod: 'sheet', seed: 41, paperXf: [1.2, -0.6, 0, 0], warp: [0.45, -0.25, 0.05],
      logoOff: [0, LOGO_Y], logoScale: [LOGO_K, LOGO_K], paperTile: 0.6 * CARD.w / 0.7, paperLo: 0.35 });
    return grab();
  }
  const envBase = { seed: 23, paperXf: [0.4, -0.3, 0, 0], warp: [0.1, -0.04, 0], paperTile: 0.6 * CARD.w / 0.7, paperLo: 0.35, noLogo: true };
  function envFrontImg() {
    card.addShape('env', { ...EV.ENV, fine: null });
    const { vp, eye, P } = view(1000, 760, EV.ENV.w, 0.9);
    card.draw(vp, eye, { ...P, inkAlb: 0.75, inkPaper: 4, inkVar: 0.3 }, { model: M4.model(0, Math.PI, 0), lod: 'env', ...envBase });
    return grab();
  }
  // le dos, rabat fermé, cachet de cire argenté sur la pointe
  function envBackImg() {
    const E = EV;
    card.addShape('env', { ...E.ENV, fine: null });
    card.addShape('envBack', { ...E.ENV, h: E.ENV_BACK_H, fine: null });
    card.addShape('flap', { ...E.ENV, h: E.FLAP_H, fine: null });
    card.addShape('botFlap', { ...E.ENV, fine: null });
    card.addShape('seal', { w: E.SEAL_D, h: E.SEAL_D, r: E.SEAL_D / 2, t: 0.2, fine: [E.SEAL_D / 2 + 1, E.SEAL_D / 2 + 1, 0.2, 0, 0], seg: 48, wobble: E.SEAL_WOB });
    const { vp, eye, P } = view(1000, 760, E.ENV.w, 0.9);
    const T = (x, y, z) => M4.model(0, 0, 0, x, y, z), Me = M4.model(0, 0, 0);
    card.draw(vp, eye, P, { model: Me, lod: 'env', ...envBase });
    card.draw(vp, eye, P, { model: M4.mul(Me, T(0, -(E.ENV.h - E.ENV_BACK_H) / 2, 1.6)), lod: 'envBack', ...envBase, seed: 31 });
    card.draw(vp, eye, P, { model: M4.mul(Me, T(0, 0, 1.74)), lod: 'botFlap', ...envBase, seed: 37, clip: [1, -E.ENV.h / 2, E.ENV.h * 0.58, E.ENV.w / 2] });
    const Mf = M4.mul(Me, M4.mul(M4.mul(T(0, E.ENV.h / 2, 1.9), M4.model(Math.PI, 0, 0)), T(0, E.FLAP_H / 2, 0)));
    card.draw(vp, eye, P, { model: Mf, lod: 'flap', ...envBase, seed: 43, clip: [1, -E.FLAP_H / 2, E.FLAP_H, E.ENV.w / 2] });
    const SEAL_LOOK = { albedo: 0.1, rough: 0.34, spec: 6, sheen: 0.2, glint: 0.7, grain: 0.35, fiber: 0, envSpec: 2.6, h: 0.42, b: 0.5, foot: 0.5, footW: 0.12, crease: 0.2, edge: 0, diffRough: 0.35 };
    const Ms = M4.mul(Mf, T(0, E.FLAP_H / 2 - 7, -0.19));
    card.draw(vp, eye, { ...P, ...SEAL_LOOK }, { model: Ms, lod: 'seal', seed: 7, paperXf: [0, 0, 0, 0], paperLo: 0.15, logoOff: [0, 0],
      logoScale: [E.SEAL_K, -E.SEAL_K], warp: [0, 0, 0], seal: [1, E.SEAL_IN, E.SEAL_D / 2, E.SEAL_WOB] });
    return grab();
  }
  async function simple() {
    const out = [];
    out.push(['dos.jpg', cardImg({ face: 'dos', seed: 3 })]);
    out.push(['vierge.jpg', cardImg({ face: 'recto', noLogo: true, seed: 5 })]);
    out.push(['bientot.jpg', cardImg({ face: 'dos', text: 'bientôt', seed: 77 })]);
    const { ITEMS } = await import('./src/portal/items.js');
    for (const it of ITEMS) out.push(['portail-' + it.id + '.jpg', cardImg({ face: 'recto', text: it.label, seed: 100 + it.id.length * 7 })]);
    out.push(['commander.jpg', cardImg({ face: 'recto', text: 'commander', seed: 5 })]);
    out.push(['feuille.jpg', sheetImg()]);
    out.push(['enveloppe.jpg', envFrontImg()]);
    out.push(['enveloppe-dos.jpg', envBackImg()]);
    // le coup de tampon blanc (fond transparent) : posé par-dessus l'enveloppe, incliné au hasard par la page
    { const PX = 12, S = Math.ceil(2 * (EV.STAMP.r + 1.5) * PX), c = document.createElement('canvas'); c.width = c.height = S;
      EV.stampInk(c.getContext('2d'), PX, card.logoMask(), S / 2 / PX, S / 2 / PX, 0, 12345);
      out.push(['tampon.png', c.toDataURL('image/png')]); }
    canvas.width = 720; canvas.height = 440;
    return out;
  }

  // ---- les vignettes de partage (09/10, une par page) : 1200 × 630, rendues par le moteur ----
  // l'image GL, puis par-dessus (Canvas 2D) les lettres ; c = canvas de sortie
  async function compose(draw2d) {
    const url0 = grab(); const img = new Image(); img.src = url0; await img.decode();
    const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0); draw2d(x);
    return c.toDataURL('image/jpeg', 0.9);
  }
  const garamond = (x, txt, px, cx, cy, col = 'rgb(174,174,174)', ls = 0.45) => {
    x.font = `500 ${px}px "SG Garamond"`; x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    try { x.letterSpacing = (px * ls) + 'px'; } catch { /* */ }
    x.fillText(txt, cx + px * ls / 2, cy);
  };
  // accueil : ETERNEL, et le logo SS gaufré en grand, en fond (le label)
  async function ogAccueil() {
    card.addShape('fond', { w: 420, h: 220, r: 0.5, t: 0.2, fine: null });
    const { vp, eye, P } = view(1200, 630, 420, 1.0);
    card.draw(vp, eye, { ...P, h: 0.5 }, { model: M4.model(0, 0, 0), lod: 'fond', seed: 9, paperXf: [0, 0, 0, 0], warp: [0, 0, 0],
      logoOff: [0, 0], logoScale: [4.4, 4.4], paperTile: 0.6 * CARD.w / 0.7, paperLo: 0.35 });
    return compose(x => garamond(x, 'ETERNEL', 64, 600, 338));
  }
  // le poème : la feuille noire, ETERNEL en colonne, les lignes à écrire
  async function ogPoeme() {
    card.addShape('sheet', { ...SHEET, fine: [10, 10, 0.25, 0, LOGO_Y] });
    const pxmmT = 630 * 0.94 / SHEET.h, frac = SHEET.w * pxmmT / 1200;
    const { vp, eye, P, pxmm } = view(1200, 630, SHEET.w, frac);
    const word = 'ETERNEL', n = word.length, lead = Math.min(10.5, 148 / (n - 1)), cap = Math.min(6.4, lead * 0.6);
    const COLX = -SHEET.w / 2 + 34, base = k => ((n - 1) / 2 - k) * lead - cap / 2;
    const list = [...word].map((ch, k) => [base(k) - 0.9, COLX + cap * 1.05 + 2.54 * 1.2, 1, k + 1]);
    card.draw(vp, eye, P, { model: M4.model(0, 0, 0), lod: 'sheet', seed: 41, paperXf: [1.2, -0.6, 0, 0], warp: [0.45, -0.25, 0.05],
      logoOff: [0, LOGO_Y], logoScale: [LOGO_K, LOGO_K], paperTile: 0.6 * CARD.w / 0.7, paperLo: 0.35, rules: { list, x1: SHEET.w / 2 - 30, a: 0.42 } });
    return compose(x => {
      const fs = cap / 0.65 * pxmm;
      [...word].forEach((ch, k) => { x.font = `500 ${fs}px "SG Garamond"`; x.fillStyle = 'rgb(214,214,214)'; x.textAlign = 'left'; try { x.letterSpacing = '0px'; } catch { /* */ }
        x.fillText(ch, 600 + COLX * pxmm, 315 - base(k) * pxmm); });
    });
  }
  // le jeu : le paquet en 3D, « le jeu » tapé au dos de la carte du dessus, SINGULIES au-dessus
  async function ogJeu() {
    canvas.width = 1200; canvas.height = 630;
    const W = 1200, H = 630, pxmm = W * 0.36 / CARD.w, Hw = H / pxmm, D = Hw / (2 * Math.tan(FOV / 2));
    const eye = [0, -D * Math.sin(TILT), D * Math.cos(TILT)], cy = -12;
    const vp = M4.mul(M4.perspective(FOV, W / H, D * 0.3, D * 3), M4.lookAt(eye, [0, cy, 0], [0, 1, 0]));
    const k = Hw / 235, R = L.lightR0 * Hw, Z = L.lightZ * k, D0 = Math.hypot(R, Z), el0 = Math.atan2(Z, R), az = L.lightAz + 0.35, el = L.elBase;
    const P = { ...L, lightPos: [Math.cos(az) * D0 * Math.cos(el), Math.sin(az) * D0 * Math.cos(el), D0 * Math.sin(el)], light: L.light * k * k * Math.sin(el0) / Math.sin(el), spotI: 0 };
    gl.viewport(0, 0, W, H); gl.clearColor(6 / 255, 6 / 255, 6 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    const ink = card.makeInk(makeInkMap('le jeu', 21).canvas);
    for (let i = 0; i < 12; i++) {
      const j = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(i + 3);
      const top = i === 11;
      card.draw(vp, eye, P, { model: M4.model(0, 0, (j() - 0.5) * 0.09, (j() - 0.5) * 3.2, cy - (11 - i) * 0.7 + (j() - 0.5) * 1.2, i * 0.36), lod: top ? 'fine' : 'coarse',
        seed: 10 + i, paperXf: [j() * 3 - 1.5, j() * 2 - 1, 0, 0], warp: [0.18, -0.08, 0.04], logoOff: [0, 0], shade: 0.55 + 0.45 * (i + 1) / 12,
        ...(top ? { inkBack: ink } : {}) });
    }
    const out = await compose(x => garamond(x, 'SINGULIES', 44, 600, 92));
    card.freeInk(ink);
    return out;
  }

  window.__assets = {
    vignettes: async () => [['og.jpg', await ogAccueil()], ['og-poeme.jpg', await ogPoeme()], ['og-jeu.jpg', await ogJeu()]],
    simple,
    og: ogShot,
    questions: QUESTIONS.map(q => q.id),
    card: id => cardShot(QUESTIONS.find(q => q.id === id).q, { seed: 1000 + id }),
    blanche: () => cardShot('carte blanche', { noLogo: true, seed: 3 }),
    letter: letterShot,
    ready: true,
  };
</script>
</body>
</html>
