<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rendu du livre</title>
<style>
  html, body { margin: 0; background: #060606; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1000" height="1300"></canvas>
<script type="module">
  // Le livre d'Eternel au repos (t = 0), rendu par le moteur du livre en direct (src/livres/book3d.js) :
  // tools/livre-shot.mjs l'enregistre dans public/livres/livre.jpg (l'aperçu du bandeau, l'image avant le direct).
  import { createBook } from './src/livres/book3d.js';
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: true, preserveDrawingBuffer: true });
  const book = await createBook(gl, './');
  // (12/10) le livre est dans le monde commun (src/app/stage.js) : l'image couvre l'écran d'un téléphone (390 × 844) ;
  // p : 0 le recueil, 1 le journal
  function render(W = 780, H = 1688, t = 0, tilt = { x: 0, y: 0 }, p = 0) {
    canvas.width = W; canvas.height = H; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    gl.clearColor(6 / 255, 6 / 255, 6 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    book.frame(W, H, W / 2, H / 2, t, tilt, { x: 0, y: 0 }, p);
    gl.finish();
    return canvas.toDataURL('image/jpeg', 0.92);
  }
  window.__livre = { ready: true, render };
</script>
</body>
</html>
