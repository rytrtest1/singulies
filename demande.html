<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Demande — SINGULIÉS</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<style>
  @font-face { font-family: 'SG Garamond'; src: url(./fonts/EBGaramond-500.woff2) format('woff2'); font-weight: 500; }
  html, body { margin: 0; height: 100%; background: #060606; overflow: hidden; touch-action: pinch-zoom; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vide { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; opacity: .4;
    font: 500 12px/1 'SG Garamond', serif; letter-spacing: .4em; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="vide">SINGULIES</div>
<script type="module">
  // la demande, ouverte depuis l'email (tout est dans le lien, après « # »)
  import { mountDemande, decodeDemande } from './src/demande/demande.js';
  const d = decodeDemande(location.hash);
  if (!d || !d.name) document.getElementById('vide').style.display = 'flex';
  else {
    document.title = d.name + ' — SINGULIÉS';
    mountDemande(document.getElementById('c'), d, { base: './', reduced: matchMedia('(prefers-reduced-motion: reduce)').matches })
      .then(m => { if (!m) document.getElementById('vide').style.display = 'flex'; });
  }
</script>
</body>
</html>
